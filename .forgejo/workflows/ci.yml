# Runs the checks named in .forgejo/checks.yaml. Upstream's .github/workflows/*
# are NEVER executed -- see docs/plans/2026-09-18-warpgate-fork-ci-design.md.
name: checks
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  checks:
    runs-on: docker
    services:
      dind:
        image: docker:28-dind
        options: --privileged
        env: {DOCKER_TLS_CERTDIR: ""}
    env:
      DOCKER_HOST: tcp://dind:2375
      # Not yet provisioned by any task in this plan -- referencing it now
      # means the compiling checks below pick it up the moment it exists,
      # with no further ci.yml edit. Until then this is empty, and
      # hardened-run.sh's own guard turns that into a clean exit 93, not a
      # crash (Task 2).
      HARDENED_RUN_IMAGE: ${{ vars.HARDENED_RUN_IMAGE }}
      S3_ENDPOINT: ${{ vars.OGA2_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, fetch-tags: true}

      # Mirrors build-image.yml's own "docker cli" step verbatim. Confirmed
      # absent here until fix round 3 (2026-09-18): this job's container has
      # the same shape as build-image.yml's (runs-on: docker, a dind service,
      # DOCKER_HOST pointed at it) but no CLI installed and no wait for dind
      # to actually be ready to accept connections -- had the first real run
      # reached this far, every `docker` call in hardened-run.sh would have
      # hit "command not found" before even getting to its own cap checks.
      - name: docker cli
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-28.3.3.tgz | tar xz -C /tmp
          install /tmp/docker/docker /usr/local/bin/docker
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
          docker info >/dev/null

      # PyYAML missing is what actually killed the first real run, 3 seconds
      # after checkout: `ModuleNotFoundError: No module named 'yaml'` in
      # checks_lib.py -- an ordinary exit 1, nowhere in this repo's 89-99
      # refusal band, from a job container that could not run a single check.
      # python3-yaml (not pip): this image's Python is externally managed
      # (PEP 668, Debian bookworm), so a bare `pip install pyyaml` refuses
      # outright, and `--break-system-packages` would be fighting the
      # platform's own package manager rather than using it. Verified here
      # rather than trusted from apt's exit code: apt can report success
      # while installing the module for a different python3 than the one on
      # PATH (more than one interpreter on the same image), which would leave
      # this step green and preflight.sh -- and every real check -- failing
      # exactly as before.
      - name: python yaml module
        run: |
          apt-get update -qq
          apt-get install -y -qq python3-yaml
          python3 -c "import yaml; print('PyYAML', yaml.__version__, 'importable at', yaml.__file__)"

      # The gate for everything above: if python3, the yaml module, the
      # docker CLI or the docker daemon is not actually usable, no check
      # below can produce a meaningful result. Exits 93 -- this codebase's
      # refusal band -- naming exactly which one is missing, rather than
      # letting the first script that happens to need it fail with an
      # ordinary, unlabelled exit 1 the way validate-checks.py did.
      - name: preflight
        run: .forgejo/scripts/preflight.sh

      # The check list must be valid before anything runs from it. A malformed
      # list that silently ran zero checks would look exactly like a green build.
      - name: validate the check list
        run: python3 .forgejo/scripts/validate-checks.py .forgejo/checks.yaml

      # Hardcoded on purpose (fix round 1): a floor like `-ge 10` lets exactly
      # one check vanish from checks.yaml and still pass -- the shape this
      # arc has flagged repeatedly as a defect, not a safety margin. This
      # number must change in the SAME commit that adds or removes a check.
      # A count that goes stale loudly and forces someone to think is the
      # correct direction; a threshold that quietly absorbs a loss is not.
      - name: prove the check list has exactly the checks we expect
        run: |
          EXPECTED=11
          n=$(python3 .forgejo/scripts/list-checks.py .forgejo/checks.yaml | wc -l)
          echo "checks to run: $n (expected $EXPECTED)"
          [ "$n" -eq "$EXPECTED" ] || { echo "FAILING ON PURPOSE: found $n check(s), expected exactly $EXPECTED.
          A run that silently drops or gains a check reports green and proves the wrong thing."; exit 1; }

      - name: configure the compiler cache (best-effort)
        run: .forgejo/scripts/configure-cache.sh warpgate-sccache

      - name: run every check
        run: .forgejo/scripts/run-all-checks.sh
