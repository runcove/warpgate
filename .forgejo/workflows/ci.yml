# Runs the checks named in .forgejo/checks.yaml. Upstream's .github/workflows/*
# are NEVER executed -- see docs/plans/2026-09-18-warpgate-fork-ci-design.md.
name: checks
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  checks:
    runs-on: docker
    # UNBOUNDED UNTIL 2026-09-19, and latent for exactly as long. Until
    # 1e9c1d6b the five capped checks refused 97 within seconds, so nothing
    # here could hang; from run 569 onward they compile for real, and a hung
    # or pathologically slow check now yields a run that never reaches a
    # terminal state while holding a slot on a shared forge. "Still running"
    # and "wedged" look identical in the run list, which is the actual harm:
    # not the lost time, the unreadable state.
    #
    # 120 rather than a number picked to feel safe. The only completed run in
    # the new regime is 569 at 1630 s (27.2 min) -- the earlier 675-717 s
    # cluster is useless as a baseline because every one of those runs was
    # refusing the compiling checks, i.e. timing an environment rather than a
    # build. So the sample is n=1, and a bound drawn tightly around n=1 would
    # kill honest runs; 120 is 4.4x it, and is the figure
    # build-ci-toolchain.yml already uses for compiling work in this same arc.
    # ci.yml was the ONLY one of our four workflows with no bound at all
    # (build-image 170, build-ci-toolchain 120, upstream-watch 20), which is
    # what marks this an oversight rather than a decision.
    #
    # A JOB-LEVEL KILL REPORTS NOTHING ABOUT WHICH CHECK HUNG. Per-check
    # bounds refusing in the 89-99 band would say, and are wanted (runcove-kzer)
    # -- but picking per-check numbers needs per-check duration data, and today
    # that is also n=1 (clippy 324 s, schema-compat 444 s, unit-tests 433 s,
    # release-build 390 s, sbom 14 s, cargo-deny 22 s, all from run 569).
    # Setting per-check bounds from one observation would repeat precisely the
    # mistake the 675-717 s cluster records. Job bound now; per-check bounds
    # once three completed runs give a band.
    timeout-minutes: 120
    # Task 7C part (a). The runner's own default for `runs-on: docker` is
    # `node:22-bookworm` (mapped in the homelab repo's k8s/platform/ci/
    # runner.yaml for every repository on the forge) -- never a Rust
    # toolchain, which is why the 18 Sep run refused all ten non-excepted
    # checks with exit 97. `container:` overrides the image for THIS job
    # only, in this fork's own workflow; it does not touch that shared
    # mapping (out of scope and explicitly prohibited for this task -- a
    # change there would swap the default image for every repo on the
    # forge, homelab's own CI included).
    #
    # Pinned by digest, not the bare `rust:1.97.1-bookworm` tag: a tag can
    # be re-pushed (a point release replaced, a base image respun) and
    # silently move the toolchain under a run that was green yesterday.
    # This is the exact digest docker/Dockerfile.cove already builds with
    # (its `chef` stage) -- reusing an image this repo has already proven,
    # rather than trusting an unvetted one, and it settles bookworm-vs-
    # bullseye the same way that Dockerfile did: Debian 11's security
    # archive went EOL 2026-08-31, so an upstream-identical bullseye image
    # can no longer even be built.
    #
    # WITHDRAWN 2026-09-19, after the run it was written for. Runs 518, 523
    # and 525 all died in the same place, and it is not our checks:
    #
    #   OCI runtime exec failed: exec: "node": executable file not found
    #
    # act_runner executes JavaScript actions -- `actions/checkout@v4` among
    # them -- with `node` INSIDE the job container. A Rust image has no
    # node, so checkout cannot run and the job dies before any check
    # exists. Two facts were proven by those runs and are worth keeping:
    # the runner DOES honour a job-level `container:` (it pulled and
    # started this exact digest, with dind alongside), and this digest is
    # pullable. The override works; the image was the wrong one.
    #
    # Not replaced with a rust+node image, because that treats the symptom.
    # `run-check.sh:118-127` runs the tools gate with `command -v` in the
    # JOB container, then `:166-176` runs capped checks in the SANDBOX --
    # so for every compiling check the gate interrogates a filesystem the
    # command will never execute on. `cargo` was being demanded where it is
    # never used. The fix is to move that question to where the work
    # happens (Ruling 55, its own task, its own tests -- a safety gate
    # moving across a boundary is not folded into an image change).
    #
    # So: back to the runner's stock `node:22-bookworm`, plus the four
    # small tools installed below. That returns `lockfile`, `biome` and
    # `helm-lint` to being able to genuinely pass -- they need `jq`,
    # `biome`, `helm` and `find`, all present -- while the compiling checks
    # keep refusing 97 naming `cargo`, which is honest and is exactly what
    # run 514 measured. Honest refusals beat a job that cannot start.
    services:
      dind:
        # --dns is the root-cause fix for the build cache never starting.
        # Run 604 measured it: this job container's resolver is Docker's
        # embedded one at 127.0.0.11, the dind daemon inherits that file,
        # refuses to hand a LOOPBACK nameserver to the containers it starts,
        # and substitutes its own built-in defaults -- Google's 8.8.8.8 and
        # 8.8.4.4 -- which cannot answer for a homelab name. Giving dind a
        # real address instead of a loopback one removes the substitution at
        # its cause, where --add-host (run-check.sh) works around it one
        # container further in. Both are kept: the mapping still covers the
        # cache host if this resolver is ever unreachable.
        #
        # 10.96.0.10 is the kube-dns ClusterIP. It is READ, not remembered,
        # and it rests on TWO independent readings taken on 2026-09-19:
        #   (a) the `# ExtServers: [10.96.0.10]` line Docker itself wrote into
        #       this job container's /etc/resolv.conf in run 604 -- i.e. the
        #       address this very container's DNS already forwards to, and
        #       which resolved the cache host there with rc=0;
        #   (b) `kubectl get svc -n kube-system kube-dns`, run against the
        #       cluster by the homelab operator session. The session that
        #       wrote this line has no kubeconfig on baba and could not take
        #       (b) itself; it is named here as someone else's reading rather
        #       than folded in as if it were one.
        # Reading (4) of the diagnostic step below re-takes (a) on every run
        # and says loudly if this pin and the live value ever diverge.
        #
        # --dns-search is deliberately NOT set, against the suggestion that it
        # should be. Run 604 lines 340 and 359 measured the dind-started
        # containers as already carrying `search ci.svc.cluster.local
        # svc.cluster.local cluster.local`: the substitution replaces the
        # nameservers and KEEPS the search list. Naming one domain here would
        # narrow a correct list of three to one, which is a change, not a fix.
        image: docker:28-dind
        options: --privileged --dns 10.96.0.10
        env: {DOCKER_TLS_CERTDIR: ""}
    env:
      DOCKER_HOST: tcp://dind:2375
      # PROVISIONED 2026-09-19: the forge repo variable now holds
      # git.tenfourty.site/runcove/warpgate-ci-toolchain:a831121e5d40, built and
      # published by run 564 and named by its own output rather than composed by
      # hand. It previously held `debian:bookworm-slim`, which is why the five
      # capped checks refused 97 -- that image has no cargo. The tag is a
      # CONTENT HASH of rust-toolchain.toml, the Dockerfile and
      # assert-toolchain.sh, so changing any of those three and not rebuilding
      # leaves this pointing at a tag no committed source produces.
      # If this is ever empty, hardened-run.sh's guard turns that into a clean
      # exit 93 rather than a crash (Task 2).
      HARDENED_RUN_IMAGE: ${{ vars.HARDENED_RUN_IMAGE }}
      S3_ENDPOINT: ${{ vars.OGA2_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, fetch-tags: true}

      # The three tools that turn `lockfile`, `helm-lint` and `biome` from
      # REFUSE 97 into a real verdict (Task 7C part (a); see checks.yaml's
      # own `tools:` lists). Each pinned -- apt to an exact bookworm package
      # build, the two binaries to an exact release verified against a
      # sha256 computed from the downloaded file before anything trusts it
      # -- so a run that passes today cannot silently start running a
      # different build tomorrow, the same reasoning as the digest pin
      # above. `just`, `taplo` and `cargo-deny` are deliberately absent:
      # they are `cargo install`, cost minutes each, and are out of scope
      # for this part.
      - name: check tools (jq, helm, biome)
        run: |
          apt-get update -qq
          apt-get install -y -qq jq=1.6-2.1+deb12u2
          jq --version

          HELM_VERSION=3.22.0
          HELM_SHA256=1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb
          curl -fsSL -o /tmp/helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
          install /tmp/linux-amd64/helm /usr/local/bin/helm
          rm -rf /tmp/helm.tgz /tmp/linux-amd64
          helm version

          # Pinned to the same 2.5.9 warpgate-web/package.json already
          # declares (^2.5.9) -- so the CLI running here and the one `npm
          # install` would give a contributor stay the same build, not just
          # the same semver range.
          BIOME_VERSION=2.5.9
          BIOME_SHA256=013eb5158b9e53235dbbf31255cb3b776fb9338b32fa6ff4a44ee1ceed65ee63
          curl -fsSL -o /usr/local/bin/biome \
            "https://github.com/biomejs/biome/releases/download/%40biomejs%2Fbiome%40${BIOME_VERSION}/biome-linux-x64"
          echo "${BIOME_SHA256}  /usr/local/bin/biome" | sha256sum -c -
          chmod +x /usr/local/bin/biome
          biome --version

      # Mirrors build-image.yml's own "docker cli" step verbatim. Confirmed
      # absent here until fix round 3 (2026-09-18): this job's container has
      # the same shape as build-image.yml's (runs-on: docker, a dind service,
      # DOCKER_HOST pointed at it) but no CLI installed and no wait for dind
      # to actually be ready to accept connections -- had the first real run
      # reached this far, every `docker` call in hardened-run.sh would have
      # hit "command not found" before even getting to its own cap checks.
      - name: docker cli
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-28.3.3.tgz | tar xz -C /tmp
          install /tmp/docker/docker /usr/local/bin/docker
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
          docker info >/dev/null

      # WHAT RUN 565 COST, stated here because the gap was invisible for a
      # reason that will recur. The capped checks pull HARDENED_RUN_IMAGE from
      # our own registry, which requires auth -- and this workflow had no
      # `docker login` at all. Nothing caught it, because until 2026-09-19 the
      # variable pointed at `debian:bookworm-slim`, which is public on Docker
      # Hub and needs no credentials. The login was missing the whole time and
      # the requirement was being met BY ACCIDENT; pointing the variable at a
      # private image is what stopped the accident.
      #
      # A dependency satisfied by accident looks exactly like one satisfied by
      # design, right up until it isn't.
      #
      # Run 565: all five capped checks REFUSED 91 ("could not start the capped
      # container") on `unauthorized: reqPackageAccess`, in 25 s -- SHORTER than
      # the 33 s of the runs where every check refused 97. A run that gets
      # faster after you give it real work has not started doing the work.
      #
      # Token handling copied from build-ci-toolchain.yml's push login, and the
      # shape is the point: the secret travels in `env:` and reaches `docker`
      # on stdin, never on argv and never spliced into the script text, because
      # a `${{ }}` inside `run:` is substituted before any shell sees it and
      # would become part of the rendered source.
      #
      # LEAST PRIVILEGE, deliberately not fixed here: REGISTRY_TOKEN was minted
      # to PUSH and is reused here to PULL. The right end state is a separate
      # read-only package token for this workflow, which needs Jeremy at the
      # forge UI -- tracked, not silently accepted. This workflow triggers only
      # on `push` to our own branches and `workflow_dispatch`; it has NO
      # `pull_request` trigger, so the token is not reachable from a pull
      # request opened against this repository. Re-check that before adding one.
      - name: registry login (to PULL the hardened image)
        run: docker login "$REGISTRY" -u jeremy --password-stdin <<< "$REGISTRY_TOKEN"
        env:
          REGISTRY: git.tenfourty.site
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

      # PyYAML missing is what actually killed the first real run, 3 seconds
      # after checkout: `ModuleNotFoundError: No module named 'yaml'` in
      # checks_lib.py -- an ordinary exit 1, nowhere in this repo's 89-99
      # refusal band, from a job container that could not run a single check.
      # python3-yaml (not pip): this image's Python is externally managed
      # (PEP 668, Debian bookworm), so a bare `pip install pyyaml` refuses
      # outright, and `--break-system-packages` would be fighting the
      # platform's own package manager rather than using it. Verified here
      # rather than trusted from apt's exit code: apt can report success
      # while installing the module for a different python3 than the one on
      # PATH (more than one interpreter on the same image), which would leave
      # this step green and preflight.sh -- and every real check -- failing
      # exactly as before.
      - name: python yaml module
        run: |
          apt-get update -qq
          apt-get install -y -qq python3-yaml
          python3 -c "import yaml; print('PyYAML', yaml.__version__, 'importable at', yaml.__file__)"

      # The gate for everything above: if python3, the yaml module, the
      # docker CLI or the docker daemon is not actually usable, no check
      # below can produce a meaningful result. Exits 93 -- this codebase's
      # refusal band -- naming exactly which one is missing, rather than
      # letting the first script that happens to need it fail with an
      # ordinary, unlabelled exit 1 the way validate-checks.py did.
      - name: preflight
        run: .forgejo/scripts/preflight.sh

      # DIAGNOSTIC ONLY, AND IT CHANGES NOTHING. Run 602 named the reason the
      # build cache has never once started, and it is not credentials, not the
      # endpoint and not TLS: every capped check emitted the same single line,
      #
      #   dns error: failed to lookup address information:
      #   Name has no usable address
      #
      # for https://oga2.tenfourty.site:8010/... -- a host that resolves fine
      # from the development machine (A record, no AAAA) and that
      # hardened-run.sh's `docker run` is given no DNS configuration for at
      # all: its argument array carries --cpus, --memory and --memory-swap and
      # nothing else.
      #
      # Three candidate causes fit that symptom equally well, which is exactly
      # the position this repo refuses to guess from. So this step takes the
      # readings that separate them, in the place the fault actually happens,
      # BEFORE any fix is written:
      #
      #   (a) the job container resolves it and a dind container does not
      #       -> the daemon's own resolver is the cause, and the honest fix is
      #          --dns with the nameserver READ from this output at run time
      #   (b) a plain dind container resolves it and a capped one does not
      #       -> the cap flags are the cause
      #   (c) nothing resolves it anywhere
      #       -> the name is unreachable from this network entirely, and only
      #          then is a pinned --add-host defensible, with a comment saying
      #          it is pinned and why
      #
      # It exits 0 unconditionally. A diagnostic that can fail the run buys a
      # verdict at the cost of the run that was carrying it.
      - name: DIAGNOSTIC (non-fatal) -- where does the cache host resolve?
        run: |
          set +e -u -o pipefail
          # Derived from the same variable the checks use, never typed: a
          # hostname written by hand here could differ from the one that
          # actually failed and the reading would answer about nothing.
          HOST=${S3_ENDPOINT#*://}; HOST=${HOST%%:*}; HOST=${HOST%%/*}
          echo "cache host under test: $HOST   (from S3_ENDPOINT=$S3_ENDPOINT)"
          echo
          echo "== (1) the JOB container, where the uncapped checks run =="
          echo "--- /etc/resolv.conf ---"; cat /etc/resolv.conf
          echo "--- getent hosts $HOST ---"; getent hosts "$HOST"; echo "getent rc=$?"
          echo
          if [ -z "${HARDENED_RUN_IMAGE:-}" ]; then
            echo "HARDENED_RUN_IMAGE is empty -- skipping the two container readings."
          else
            echo "== (2) a PLAIN container on the dind daemon, no cap flags =="
            docker run --rm "$HARDENED_RUN_IMAGE" sh -c \
              'echo "--- /etc/resolv.conf ---"; cat /etc/resolv.conf; echo "--- getent ---"; getent hosts '"$HOST"'; echo "getent rc=$?"'
            echo "docker run rc=$?"
            echo
            echo "== (3) the SAME image with the cap flags hardened-run.sh passes =="
            # Representative caps, not read from checks.yaml: the question here
            # is only whether --cpus/--memory/--memory-swap change resolution,
            # and no value of them should. Note this uses `docker run` where
            # hardened-run.sh uses `docker run -d` + `docker exec`; DNS is
            # decided at container creation, so the reading carries, but the
            # difference is stated rather than glossed.
            docker run --rm --cpus=4 --memory=7g --memory-swap=7g "$HARDENED_RUN_IMAGE" sh -c \
              'echo "--- /etc/resolv.conf ---"; cat /etc/resolv.conf; echo "--- getent ---"; getent hosts '"$HOST"'; echo "getent rc=$?"'
            echo "docker run rc=$?"
          fi
          echo
          echo "== (4) is the --dns pin in this file still what the cluster hands us? =="
          # The services: block has to name the resolver as a literal -- YAML
          # has no shell to resolve one. So the literal is CHECKED instead of
          # trusted: the left side is read back out of the workflow file in
          # the checkout, the right side out of the line Docker writes into
          # this container's own /etc/resolv.conf. Nothing here is typed.
          #
          # Honest limit: this guard lives in a workflow step, so unlike
          # run-check.sh's assertions nothing refuses its DELETION -- only its
          # failure. Promoting it to a tested script is runcove-p4mu's shape,
          # not this commit's.
          # Anchored on the `options:` line, not on the first `--dns` in the
          # file: the comments around it also say `--dns`, and a guard that
          # can read its own prose instead of the live setting is the kind of
          # reading that cannot tell two cases apart.
          PINNED=$(grep -m1 -E '^[[:space:]]*options:.*--dns[[:space:]]' \
                     .forgejo/workflows/ci.yml \
                   | grep -oE -- '--dns[[:space:]]+[0-9]+(\.[0-9]+){3}' \
                   | grep -oE '[0-9]+(\.[0-9]+){3}')
          LIVE=$(grep -m1 '^# ExtServers:' /etc/resolv.conf \
                 | grep -oE '[0-9]+(\.[0-9]+){3}' | head -1)
          if [ -z "$PINNED" ] || [ -z "$LIVE" ]; then
            # Stated, never silent: a missing reading is not a passing one.
            echo "DNS-PIN UNCHECKED -- pinned='$PINNED' live='$LIVE'. One of the"
            echo "  two readings did not come back, so this run says NOTHING about"
            echo "  whether the pin is still right. Look at (1) above for why."
          elif [ "$PINNED" = "$LIVE" ]; then
            echo "DNS-PIN OK -- ci.yml pins $PINNED and this job container's"
            echo "  resolver forwards to $PINNED. Two readings, same answer."
          else
            echo "DNS-PIN DRIFT -- ci.yml pins --dns $PINNED but this job"
            echo "  container's resolver forwards to $LIVE. The dind containers"
            echo "  are being pointed at an address the cluster no longer uses,"
            echo "  so every capped check has lost DNS and is running uncached."
            echo "  Fix: set --dns $LIVE in the services: dind: options of"
            echo "  .forgejo/workflows/ci.yml."
          fi
          echo
          echo "DIAGNOSTIC COMPLETE -- exiting 0 whatever the above says."
          exit 0

      # Every CI defect this arc has produced lived in the machinery that RUNS
      # the checks, not in the checks themselves: a port stripped from the cache
      # endpoint, a missing region that broke every rustc call, a guard that
      # certified an environment nobody runs in. Those scripts have 11 shell
      # suites and 59 python tests, and until now nothing ran them except a
      # human remembering to. This step makes the check runner prove itself
      # before it is trusted to report on the product.
      #
      # It runs AFTER preflight (which proves python3, yaml and docker are
      # usable at all -- 115 s of selftests against a container that cannot run
      # them is 115 s of noise) and BEFORE the check list is validated, counted
      # or used, because a broken runner's verdict on checks.yaml is worthless.
      #
      # Cost, decided rather than assumed: test-hardened-run.sh alone is 92 s of
      # the ~115 s total, and it is the suite guarding hardened-run.sh, which is
      # where every one of today's defects lived. Against a run that takes 27
      # minutes uncached that is under six percent, for the coverage that matters
      # most. If the cost ever needs cutting the lever is caching or a separate
      # job, not dropping the suite.
      #
      # Both counts are hardcoded for the same reason EXPECTED=11 is below: a
      # floor absorbs a suite that stops being discovered, and a suite that
      # vanishes is exactly the failure this step exists to catch. They change in
      # the same commit that adds or removes a test.
      #
      # The shell loop runs ALL suites and reports every failure. Stopping at the
      # first one turns this step into a light bulb when what a CI log needs is
      # an instrument -- this arc has already paid four CI runs for that mistake,
      # one per defect discovered in sequence.
      - name: prove the check machinery itself (selftests)
        run: |
          set +e -u -o pipefail
          cd .forgejo/scripts/tests
          EXPECTED_PY=59
          EXPECTED_SH=11

          py_out=$(python3 -m unittest discover -p 'test_*.py' 2>&1); py_rc=$?
          printf '%s\n' "$py_out" | tail -3
          py_n=$(printf '%s\n' "$py_out" | sed -n 's/^Ran \([0-9]\{1,\}\) tests\{0,1\} in .*/\1/p' | tail -n1)
          [ "$py_rc" -eq 0 ] || { printf '%s\n' "$py_out"; echo "FAILING ON PURPOSE: python selftests failed (exit $py_rc)."; exit 1; }
          [ "${py_n:-0}" -eq "$EXPECTED_PY" ] || { echo "FAILING ON PURPOSE: expected exactly $EXPECTED_PY python tests, the run reported '${py_n:-<none>}'.
          A count that drifts down silently means tests stopped being discovered, which looks identical to them passing."; exit 1; }
          echo "python selftests: $py_n tests, all passed (expected $EXPECTED_PY)"

          # The other half of "prove the container path in CI instead".
          # test-hardened-run.sh's real --source delivery cases need a real
          # docker daemon; where there is none they SKIP and say so, which is
          # right on a development host and worthless here -- this job IS the
          # environment those cases were moved to. With this set, that skip is
          # a failed step, so the container path is either proven in this run
          # or the run is red. Without it (a hand run on baba) the skip stands.
          export HARDENED_RUN_TESTS_REQUIRE_REAL_ENGINE=1

          shopt -s nullglob
          suites=(test-*.sh)
          [ "${#suites[@]}" -eq "$EXPECTED_SH" ] || { echo "FAILING ON PURPOSE: found ${#suites[@]} shell suite(s), expected exactly $EXPECTED_SH."; exit 1; }

          logdir=$(mktemp -d)
          failed=()
          for t in "${suites[@]}"; do
            bash "$t" > "$logdir/$t.log" 2>&1; t_rc=$?
            if [ "$t_rc" -eq 0 ]; then
              # A passing suite printed one line and nothing else, so a reader
              # could not tell a suite that proved its cases from one that
              # skipped them and exited 0 anyway. Any suite reporting skips
              # says so here. In this job the count must be 0: the
              # require-flag above turns a skip into a failure, so a non-zero
              # count reaching this line would itself be a finding.
              skipline=$(grep -m1 '^skipped: ' "$logdir/$t.log" || true)
              echo "  ok    $t${skipline:+  ($skipline)}"
            else
              echo "  FAIL  $t (exit $t_rc)"
              sed 's/^/        /' "$logdir/$t.log" | tail -25
              failed+=("$t")
            fi
          done
          [ "${#failed[@]}" -eq 0 ] || { echo "FAILING ON PURPOSE: ${#failed[@]} of ${#suites[@]} selftest suite(s) failed: ${failed[*]}"; exit 1; }
          echo "shell selftests: ${#suites[@]} suites, all passed (expected $EXPECTED_SH)"

      # The check list must be valid before anything runs from it. A malformed
      # list that silently ran zero checks would look exactly like a green build.
      - name: validate the check list
        run: python3 .forgejo/scripts/validate-checks.py .forgejo/checks.yaml

      # Hardcoded on purpose (fix round 1): a floor like `-ge 10` lets exactly
      # one check vanish from checks.yaml and still pass -- the shape this
      # arc has flagged repeatedly as a defect, not a safety margin. This
      # number must change in the SAME commit that adds or removes a check.
      # A count that goes stale loudly and forces someone to think is the
      # correct direction; a threshold that quietly absorbs a loss is not.
      - name: prove the check list has exactly the checks we expect
        run: |
          EXPECTED=11
          n=$(python3 .forgejo/scripts/list-checks.py .forgejo/checks.yaml | wc -l)
          echo "checks to run: $n (expected $EXPECTED)"
          [ "$n" -eq "$EXPECTED" ] || { echo "FAILING ON PURPOSE: found $n check(s), expected exactly $EXPECTED.
          A run that silently drops or gains a check reports green and proves the wrong thing."; exit 1; }

      - name: configure the compiler cache (best-effort)
        run: .forgejo/scripts/configure-cache.sh warpgate-sccache

      - name: run every check
        run: .forgejo/scripts/run-all-checks.sh
