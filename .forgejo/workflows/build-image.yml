name: build-image
on:
  push:
    branches: ['cove-patches-v*', 'wip/**']
  workflow_dispatch:
concurrency: {group: warpgate-build, cancel-in-progress: false}
jobs:
  test-and-build:
    runs-on: docker
    timeout-minutes: 170
    services:
      dind:
        image: docker:28-dind
        options: --privileged
        env: {DOCKER_TLS_CERTDIR: ""}
    env:
      DOCKER_HOST: tcp://dind:2375
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, fetch-tags: true}
      - name: docker cli
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-28.3.3.tgz | tar xz -C /tmp
          install /tmp/docker/docker /usr/local/bin/docker
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
          docker info >/dev/null
      - name: buildx plugin (BuildKit — docker/Dockerfile.cove requires it for --mount=type=cache)
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL -o ~/.docker/cli-plugins/docker-buildx \
            https://github.com/docker/buildx/releases/download/v0.37.1/buildx-v0.37.1.linux-amd64
          chmod +x ~/.docker/cli-plugins/docker-buildx
          docker buildx version
      - name: tests (capped, never on baba)
        run: |
          # Run-scoped name: wgtest is a fixed name in dind's shared dockerd,
          # so a leftover from a prior failed run would collide with `docker
          # create` on the next one. Suffixing with the run id makes every
          # run's container unique, and it is removed by that exact name
          # below — never by prune, pattern or age.
          NAME="wgtest-${{ github.run_id }}"
          # Ordinary bridge network, not --network host: inside dind,
          # --network host is dind's OWN network namespace, i.e. the shared
          # daemon's namespace, not an isolated one. The test binary
          # (`cargo test -p warpgate-common-http`) doesn't bind or listen on
          # anything — its tests are pure in-process assertions (CSP header
          # construction, request-URI building, hostname-string comparison) —
          # so it has no need to share dind's namespace; bridge still gives
          # it normal outbound access to fetch crates.
          docker create --name "$NAME" --network bridge --cpus 4 --memory 7g --memory-swap 7g \
            -e CARGO_BUILD_JOBS=2 -w /src docker.io/library/rust:1-bookworm \
            bash -c 'rustup show && cargo test -p warpgate-common-http'
          docker cp . "$NAME":/src
          set +e
          docker start -a "$NAME"
          RC=$?
          set -e
          docker rm -f "$NAME"
          exit $RC
      - name: stop here for wip branches
        if: startsWith(github.ref_name, 'wip/')
        run: echo "tests only on wip/*"
      - name: registry login
        if: ${{ !startsWith(github.ref_name, 'wip/') }}
        run: docker login git.tenfourty.site -u jeremy --password-stdin <<< "${{ secrets.REGISTRY_TOKEN }}"
      - name: build (BuildKit, capped via docker-container driver-opts, registry cache)
        if: ${{ !startsWith(github.ref_name, 'wip/') }}
        run: |
          TAG=$(git describe --tags --long)
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # Run-scoped name: capped is a fixed buildx builder name in the
          # same shared dockerd as wgtest/wg. A leftover builder (and its
          # companion buildx_buildkit_capped0 container) from a prior failed
          # run would collide with `buildx create` on the next one. Suffix
          # with the run id and remove it by that exact name at the end of
          # this step — never by prune, pattern or age.
          BUILDER="capped-${{ github.run_id }}"
          docker buildx create --name "$BUILDER" --driver docker-container \
            --driver-opt memory=7g --driver-opt memory-swap=7g \
            --driver-opt cpu-quota=400000 --driver-opt cpu-period=100000 \
            --use
          docker buildx inspect --bootstrap
          # Assert the memory cap actually landed on the container that does
          # the heavy work, not just that the flag was accepted. buildx's
          # docker-container driver creates a companion container named
          # buildx_buildkit_<builder>0 that executes every Dockerfile RUN
          # step (cook, compile, link) — the --driver-opt memory=7g/
          # memory-swap=7g above are supposed to land on THAT container, not
          # on the job container or the dind service container beside it
          # (both intentionally uncapped for memory at the runner level —
          # verified 2026-09-15, see below). A silently-ignored driver-opt
          # here is exactly the failure mode that let a 2026-09-15 build run
          # uncapped past the runner pod's own cgroup and onto the node.
          BUILDKIT_CONTAINER="buildx_buildkit_${BUILDER}0"
          BUILDKIT_MEM=$(docker inspect "$BUILDKIT_CONTAINER" --format '{{.HostConfig.Memory}}')
          echo "=== $BUILDKIT_CONTAINER memory cap: $BUILDKIT_MEM bytes ==="
          if [ "$BUILDKIT_MEM" = "0" ]; then
            echo "REFUSING TO BUILD: $BUILDKIT_CONTAINER has HostConfig.Memory=0 (no limit)."
            echo "The --driver-opt memory=7g/memory-swap=7g above did not land on the"
            echo "container that actually compiles and links. Building uncapped here can"
            echo "consume node memory outside the runner pod's own 10Gi limit."
            exit 1
          fi
          # CARGO_PROFILE_RELEASE_LTO=thin: fat LTO (Cargo.toml's own
          # [profile.release] lto=true) OOM'd linking warpgate itself (run
          # 2374, ~6-8 GB documented peak, a single whole-workspace link
          # unit) under the memory cap on buildx_buildkit_<builder>0 — the
          # container asserted above, which is what actually executes every
          # Dockerfile RUN step including this link. That cap is not just
          # the driver-opt flag being accepted without error: verified live
          # on 2026-09-15 by reading buildx_buildkit_capped0's own cgroup
          # directly (/sys/fs/cgroup/memory.max matched HostConfig.Memory
          # exactly, and memory.current sat within 73KB of it under real
          # reclaim pressure) — a real, kernel-enforced ceiling on the
          # container that compiles and links, confirmed rather than merely
          # inferred from the flag being accepted. This overrides LTO via
          # env var only — Cargo.toml is untouched — per the coordinator's
          # ruling: keep the AWS SDK dependency (a 9-crate refactor is a
          # permanent rebase tax not worth paying), fix the actual cause
          # (LTO's link-memory peak) instead. thin keeps most of fat LTO's
          # runtime benefit at a fraction of the link memory; falls back to
          # CARGO_PROFILE_RELEASE_LTO=false only if thin still OOMs.
          # CARGO_BUILD_JOBS=1 (2026-09-15, run 490/2386): 2 let aws-sdk-rds and
          # aws-sdk-ec2 compile concurrently during `cargo chef cook`, and the
          # two together OOM'd under the 7g cap — a dependency-compile-phase
          # OOM, distinct from run 2374's final-link OOM under fat LTO. 1 keeps
          # every crate's own compile serialized so no two large crates share
          # the cap at once. Talos01 (the storage-migration node) had no
          # memory headroom to raise the cap instead (ops: ~3.3 GB available
          # at the kill, node 72% used running etcd) — CARGO_BUILD_JOBS=1 was
          # ops' choice over a bigger cap for that reason, not a Cargo/LTO
          # concern. Changes wall time and I/O rate versus run 488's
          # CARGO_BUILD_JOBS=2, so that comparison is no longer like-for-like;
          # noted, not hidden.
          BUILD_START=$(date +%s)
          docker buildx build --builder "$BUILDER" \
            --build-arg CARGO_BUILD_JOBS=1 --build-arg CARGO_INCREMENTAL=0 \
            --build-arg CARGO_PROFILE_RELEASE_LTO=thin \
            --cache-to type=registry,ref=git.tenfourty.site/jeremy/warpgate:buildcache,mode=max \
            --cache-from type=registry,ref=git.tenfourty.site/jeremy/warpgate:buildcache \
            --load -f docker/Dockerfile.cove -t git.tenfourty.site/jeremy/warpgate:$TAG .
          BUILD_END=$(date +%s)
          echo "BUILD_SECONDS=$((BUILD_END - BUILD_START))" >> "$GITHUB_ENV"
          echo "=== build wall time: $((BUILD_END - BUILD_START))s ==="
          echo "=== image size ==="
          docker image inspect git.tenfourty.site/jeremy/warpgate:$TAG --format='{{.Size}} bytes'
          docker buildx rm "$BUILDER"
      - name: smoke test — version matches the build, binary starts and serves
        if: ${{ !startsWith(github.ref_name, 'wip/') }}
        run: |
          IMG=git.tenfourty.site/jeremy/warpgate:$TAG
          # Run-scoped names: wg and wgsmoke are fixed names in the same
          # shared dockerd. wgsmoke matters more than idempotent creation
          # suggests: the runner has two slots, so two runs can overlap,
          # and a shared /data means one run's unattended-setup seeds state
          # the other inherits — a pass could mean "the other run set this
          # up", not "this image works". The same risk exists across time
          # too: a leftover volume means the next run's setup isn't
          # touching a clean volume. Removed by exact name below at the end
          # of this step — never by prune, pattern or age.
          WG="wg-${{ github.run_id }}"
          VOL="wgsmoke-${{ github.run_id }}"
          echo "=== binary version check (blocking) ==="
          # `warpgate --version` (clap's auto flag) only ever prints
          # CARGO_PKG_VERSION (e.g. "0.28.6") — it can never match $TAG. The
          # binary's real build identity comes from the `version` subcommand
          # (warpgate/src/main.rs Commands::Version), which prints
          # `warpgate_version()` — warpgate-common/src/version.rs's
          # git_version!(args = ["--tags", "--always", "--dirty=-modified",
          # "--match", "v[0-9]*"]). Compute the expected string with the
          # identical git-describe invocation rather than reusing $TAG
          # (which is deliberately `--long` with no --match, for the image
          # tag's own interface contract) so this check is correct even when
          # the two formulas would otherwise diverge (e.g. HEAD sitting
          # exactly on a v* tag).
          EXPECTED_VERSION="warpgate $(git describe --tags --always --dirty=-modified --match 'v[0-9]*')"
          ACTUAL_VERSION=$(docker run --rm $IMG warpgate version)
          echo "built tag:        $TAG"
          echo "expected version: $EXPECTED_VERSION"
          echo "actual version:   $ACTUAL_VERSION"
          [ "$ACTUAL_VERSION" = "$EXPECTED_VERSION" ] || { echo "VERSION MISMATCH — the binary does not report the commit it was built from"; exit 1; }
          docker volume create "$VOL"
          docker run --rm -v "$VOL":/data -e WARPGATE_ADMIN_PASSWORD=smoke-only $IMG \
            unattended-setup --data-path /data --http-port 8888 --record-sessions
          docker run -d --name "$WG" -v "$VOL":/data $IMG run
          for i in $(seq 1 30); do
            code=$(docker run --rm --network container:"$WG" docker.io/curlimages/curl:8.22.0 \
              -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:8888/@warpgate/api/info || true)
            [ "$code" = "200" ] && break; sleep 2
          done
          docker logs "$WG" | tail -20 || true
          docker rm -f "$WG"
          docker volume rm "$VOL"
          test "$code" = "200"
      - name: push
        if: ${{ !startsWith(github.ref_name, 'wip/') }}
        run: docker push git.tenfourty.site/jeremy/warpgate:$TAG
