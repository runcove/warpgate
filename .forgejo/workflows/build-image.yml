name: build-image
on:
  push:
    branches: ['cove-patches-v*', 'wip/**']
  workflow_dispatch:
concurrency: {group: warpgate-build, cancel-in-progress: false}
jobs:
  test-and-build:
    runs-on: docker
    timeout-minutes: 170
    services:
      dind:
        image: docker:28-dind
        options: --privileged
        env: {DOCKER_TLS_CERTDIR: ""}
    env:
      DOCKER_HOST: tcp://dind:2375
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, fetch-tags: true}
      - name: docker cli
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-28.3.3.tgz | tar xz -C /tmp
          install /tmp/docker/docker /usr/local/bin/docker
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
          docker info >/dev/null
      - name: buildx plugin (BuildKit — docker/Dockerfile.cove requires it for --mount=type=cache)
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL -o ~/.docker/cli-plugins/docker-buildx \
            https://github.com/docker/buildx/releases/download/v0.37.1/buildx-v0.37.1.linux-amd64
          chmod +x ~/.docker/cli-plugins/docker-buildx
          docker buildx version
      - name: tests (capped, never on baba)
        run: |
          # Run-scoped name: wgtest is a fixed name in dind's shared dockerd,
          # so a leftover from a prior failed run would collide with `docker
          # create` on the next one. Suffixing with the run id makes every
          # run's container unique, and it is removed by that exact name
          # below — never by prune, pattern or age.
          NAME="wgtest-${{ github.run_id }}"
          # Ordinary bridge network, not --network host: inside dind,
          # --network host is dind's OWN network namespace, i.e. the shared
          # daemon's namespace, not an isolated one. The test binary
          # (`cargo test -p warpgate-common-http`) doesn't bind or listen on
          # anything — its tests are pure in-process assertions (CSP header
          # construction, request-URI building, hostname-string comparison) —
          # so it has no need to share dind's namespace; bridge still gives
          # it normal outbound access to fetch crates.
          # 7g -> 10g (2026-09-15, ops-approved as ONE measurement run). Kept
          # in step with the builder cap below purely so the two do not drift;
          # this test container has never been the one pressing a ceiling.
          docker create --name "$NAME" --network bridge --cpus 4 --memory 10g --memory-swap 10g \
            -e CARGO_BUILD_JOBS=2 -w /src docker.io/library/rust:1-bookworm \
            bash -c 'rustup show && cargo test -p warpgate-common-http'
          docker cp . "$NAME":/src
          set +e
          docker start -a "$NAME"
          RC=$?
          set -e
          docker rm -f "$NAME"
          exit $RC
      - name: stop here for wip branches
        if: startsWith(github.ref_name, 'wip/')
        run: echo "tests only on wip/*"
      - name: registry login
        if: ${{ !startsWith(github.ref_name, 'wip/') }}
        run: docker login git.tenfourty.site -u jeremy --password-stdin <<< "${{ secrets.REGISTRY_TOKEN }}"
      - name: build (BuildKit, capped via docker-container driver-opts, registry cache)
        if: ${{ !startsWith(github.ref_name, 'wip/') }}
        run: |
          TAG=$(git describe --tags --long)
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # Run-scoped name: capped is a fixed buildx builder name in the
          # same shared dockerd as wgtest/wg. A leftover builder (and its
          # companion buildx_buildkit_capped0 container) from a prior failed
          # run would collide with `buildx create` on the next one. Suffix
          # with the run id and remove it by that exact name at the end of
          # this step — never by prune, pattern or age.
          BUILDER="capped-${{ github.run_id }}"
          # network=host (2026-09-15): the buildkit container does NOT inherit
          # the cluster's resolver. Its /etc/resolv.conf, captured from run
          # 493/2439, reads `nameserver 8.8.8.8 / 8.8.4.4` with the note
          # "Based on host file: '/etc/resolv.conf' (legacy) / Used default
          # nameservers" — it inherited the cluster SEARCH DOMAINS
          # (ci.svc.cluster.local ...) but not the nameservers, so dockerd
          # substituted its public fallback. git.tenfourty.site has no public
          # record, so every cache import and export has been failing:
          #   dial tcp: lookup git.tenfourty.site on 8.8.8.8:53: no such host
          # That is why every build recompiles from scratch despite a
          # registry cache being configured — the cache has never once been
          # read or written. Worth more than the memory cap.
          #
          # `network=host` here means the DIND DAEMON's network namespace (the
          # service container this job's DOCKER_HOST points at), not the
          # cluster node's — the same namespace the registry login and image
          # push already resolve from successfully. If a later change ever
          # gives buildkit its own namespace again, the alternative is a
          # buildkitd.toml with the registry's LAN address under [dns].
          #
          # PROOF THIS WORKED is one line in the build output: "exporting
          # cache to registry". Its absence means the cache is still dead, no
          # matter how the build itself exits.
          docker buildx create --name "$BUILDER" --driver docker-container \
            --driver-opt network=host \
            --driver-opt memory=10g --driver-opt memory-swap=10g \
            --driver-opt cpu-quota=400000 --driver-opt cpu-period=100000 \
            --use
          docker buildx inspect --bootstrap
          # Assert the memory cap actually landed on the container that does
          # the heavy work, not just that the flag was accepted. buildx's
          # docker-container driver creates a companion container named
          # buildx_buildkit_<builder>0 that executes every Dockerfile RUN
          # step (cook, compile, link) — the --driver-opt memory=10g/
          # memory-swap=10g above are supposed to land on THAT container, not
          # on the job container or the dind service container beside it
          # (both intentionally uncapped for memory at the runner level —
          # verified 2026-09-15, see below). A silently-ignored driver-opt
          # here is exactly the failure mode that let a 2026-09-15 build run
          # uncapped past the runner pod's own cgroup and onto the node.
          BUILDKIT_CONTAINER="buildx_buildkit_${BUILDER}0"
          BUILDKIT_MEM=$(docker inspect "$BUILDKIT_CONTAINER" --format '{{.HostConfig.Memory}}')
          echo "=== $BUILDKIT_CONTAINER memory cap: $BUILDKIT_MEM bytes ==="
          if [ "$BUILDKIT_MEM" = "0" ]; then
            echo "REFUSING TO BUILD: $BUILDKIT_CONTAINER has HostConfig.Memory=0 (no limit)."
            echo "The --driver-opt memory=10g/memory-swap=10g above did not land on the"
            echo "container that actually compiles and links. Building uncapped here can"
            echo "consume node memory outside the runner pod's own dind limit."
            exit 1
          fi
          # CARGO_PROFILE_RELEASE_LTO=thin: fat LTO (Cargo.toml's own
          # [profile.release] lto=true) OOM'd linking warpgate itself (run
          # 2374, ~6-8 GB documented peak, a single whole-workspace link
          # unit) under the memory cap on buildx_buildkit_<builder>0 — the
          # container asserted above, which is what actually executes every
          # Dockerfile RUN step including this link. That cap is not just
          # the driver-opt flag being accepted without error: verified live
          # on 2026-09-15 by reading buildx_buildkit_capped0's own cgroup
          # directly (/sys/fs/cgroup/memory.max matched HostConfig.Memory
          # exactly, and memory.current sat within 73KB of it under real
          # reclaim pressure) — a real, kernel-enforced ceiling on the
          # container that compiles and links, confirmed rather than merely
          # inferred from the flag being accepted. This overrides LTO via
          # env var only — Cargo.toml is untouched — per the coordinator's
          # ruling: keep the AWS SDK dependency (a 9-crate refactor is a
          # permanent rebase tax not worth paying), fix the actual cause
          # (LTO's link-memory peak) instead. thin keeps most of fat LTO's
          # runtime benefit at a fraction of the link memory; falls back to
          # CARGO_PROFILE_RELEASE_LTO=false only if thin still OOMs.
          # CARGO_BUILD_JOBS=1 (2026-09-15, run 490/2386). CORRECTED from the
          # run's own log on 2026-09-15: an earlier version of this comment
          # said JOBS=2 "let aws-sdk-rds and aws-sdk-ec2 compile concurrently
          # and the two together OOM'd". That is WRONG and must not be
          # reinstated. What the log shows: the run died in `cargo chef cook`
          # (not the final link), the SIGKILLed process was
          # `rustc --crate-name aws_sdk_ec2 --crate-type lib` (a dependency
          # rlib), concurrency was real (cargo printed "build failed, waiting
          # for other jobs to finish") but the OTHER slot held unrelated small
          # crates — aws-sdk-rds started 1.4s before aws-sdk-ec2 and
          # aws-sdk-ec2 lived 175s longer, with 15 small crates (picky,
          # x25519-dalek, syn, vt100 ...) starting in the final 15.5s. So it
          # was one long AWS SDK crate beside a fast churn of small ones, not
          # two heavyweights coinciding.
          #
          # AND THE LEVER IS NOT WHAT THIS COMMENT ASSUMED. Run 493/2439 ran
          # with CARGO_BUILD_JOBS=1 — read from the live process's own
          # /proc/<pid>/environ, with exactly ONE resident rustc — and still
          # held the cap for 2m51s (memory.events max 0 -> 12970, oom_kill 0).
          # The ceiling is therefore reached with ZERO contribution from
          # parallel crate count. The mechanism is `-Zthreads=8` in
          # .cargo/config.toml under [target.'cfg(all())'] — intra-crate
          # codegen parallelism that CARGO_BUILD_JOBS does not bound, applying
          # to every profile including cook, fixed at 8 regardless of the
          # container's --cpus=4. Upstream's own choice (introduced 9f24f0f7,
          # v0.28.6), not a cove patch.
          #
          # So JOBS=1 is retained as a conservative floor, NOT because it is
          # the lever. Whether parallel crates add peak on top of the
          # intra-crate floor at higher JOBS is UNMEASURED — no run isolates
          # it. Talos01 had no headroom to raise the cap at the time (~3.3 GB
          # available at the kill, node 72% used running etcd); talos02 now
          # does, which is what this run tests. Wall time and I/O rate are not
          # like-for-like against run 488's JOBS=2; noted, not hidden.
          # ---- self-measurement (2026-09-15) ----
          # The point of raising the cap is to find out whether 10g is a PEAK
          # the build reaches or another CEILING it is pressed against. A
          # single reading at the end cannot tell those apart: memory.peak is
          # a high-water mark with no timestamp, so finding it at the cap says
          # only "at some point", never when or for how long. What separates
          # them is memory.events `max` — reclaim events under the ceiling.
          # Zero of them means 10g was never reached and the peak is real; a
          # climbing count means we have simply moved the wall.
          #
          # Sampled from inside the job, through the same DOCKER_HOST the
          # build already uses. Deliberately NOT read by an operator reaching
          # into the container from outside: that needs cluster access this
          # job does not have and should not need, and it makes the numbers
          # someone's report rather than the build's own output. Scope is the
          # buildkit container's own cgroup — the one that executes every RUN
          # step. It does not reach the runner pod or the node.
          #
          # The loop exits on its own when the container goes away, so a
          # failed build cannot leave it running; the kill below is belt and
          # braces. Sampling is one `docker exec` every 15s against a local
          # socket -- negligible beside a 30-minute compile.
          (
            while docker inspect "$BUILDKIT_CONTAINER" >/dev/null 2>&1; do
              echo "MEMSAMPLE $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                "$(docker exec "$BUILDKIT_CONTAINER" cat /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.peak 2>/dev/null | tr '\n' ' ')" \
                "$(docker exec "$BUILDKIT_CONTAINER" cat /sys/fs/cgroup/memory.events 2>/dev/null | tr '\n' ' ')" \
                "io $(docker exec "$BUILDKIT_CONTAINER" cat /sys/fs/cgroup/io.stat 2>/dev/null | tr '\n' ' ')"
              sleep 15
            done
          ) &
          SAMPLER_PID=$!
          # Every sample carries its own UTC timestamp and names its cgroup in
          # this comment rather than in each line, because three figures have
          # been misattributed on this cluster by being read at the wrong
          # level. These are buildx_buildkit_<builder>0's OWN cgroup: not the
          # service dind's hierarchical total (which includes this container
          # and reads high for the wrong reason), and not the node's.
          BUILD_START=$(date +%s)
          IMG=git.tenfourty.site/jeremy/warpgate:$TAG
          # run 2389 (2026-09-15): the build SUCCEEDED -- every crate compiled,
          # warpgate linked (27m21s), and `--load` put the image into this dind
          # -- and the job still failed, because `--cache-to` could not resolve
          # git.tenfourty.site during a WAN blip. buildx treats `--load` and
          # `--cache-to` as two outputs of ONE invocation, so one output failing
          # fails the whole command; `set -e` then killed the step before the
          # size report, and the smoke test and push steps never ran. An hour of
          # compute discarded because an upload to a CACHE failed.
          #
          # The image is this build's output. The cache is an optimisation. So
          # the success criterion is "was an image produced", asserted directly
          # against dockerd rather than inferred from buildx's exit code.
          #
          # The tag is removed first because TAG is a git-describe string, not
          # run-scoped: two runs on the same commit share it, and a leftover
          # image from the earlier one would otherwise answer this run's
          # question. Without that line the check could pass having proved
          # nothing about this build.
          docker image rm -f "$IMG" >/dev/null 2>&1 || true
          set +e
          docker buildx build --builder "$BUILDER" \
            --build-arg CARGO_BUILD_JOBS=1 --build-arg CARGO_INCREMENTAL=0 \
            --build-arg CARGO_PROFILE_RELEASE_LTO=thin \
            --cache-to type=registry,ref=git.tenfourty.site/jeremy/warpgate:buildcache,mode=max \
            --cache-from type=registry,ref=git.tenfourty.site/jeremy/warpgate:buildcache \
            --load -f docker/Dockerfile.cove -t "$IMG" .
          BUILD_RC=$?
          set -e
          # Stop sampling before anything else can exit the step. Placed after
          # `set -e` is restored but before the image checks below, so a build
          # failure still leaves the samples in the log for exactly the run we
          # most want to understand. `|| true` because the loop may already
          # have exited on its own when the container went away, and a kill of
          # a dead pid must not fail the step that is reporting the build.
          kill "$SAMPLER_PID" 2>/dev/null || true
          wait "$SAMPLER_PID" 2>/dev/null || true
          echo "=== memory sampling ended; grep MEMSAMPLE above for the series ==="
          if docker image inspect "$IMG" >/dev/null 2>&1; then
            if [ "$BUILD_RC" -ne 0 ]; then
              echo "=== buildx exited $BUILD_RC, but the image WAS built and loaded ==="
              echo "Treating as success: the failing output is the registry cache export, not the image."
              echo "Consequence: the buildcache is now stale, so the next build recompiles more. Not fatal."
            fi
          else
            echo "=== buildx exited $BUILD_RC and no image was loaded -- a real build failure ==="
            if [ "$BUILD_RC" -eq 0 ]; then BUILD_RC=1; fi
            exit "$BUILD_RC"
          fi
          BUILD_END=$(date +%s)
          echo "BUILD_SECONDS=$((BUILD_END - BUILD_START))" >> "$GITHUB_ENV"
          echo "=== build wall time: $((BUILD_END - BUILD_START))s ==="
          echo "=== image size ==="
          docker image inspect "$IMG" --format='{{.Size}} bytes'
          docker buildx rm "$BUILDER"
      - name: smoke test — version matches the build, binary starts and serves
        if: ${{ !startsWith(github.ref_name, 'wip/') }}
        run: |
          IMG=git.tenfourty.site/jeremy/warpgate:$TAG
          # Run-scoped names: wg and wgsmoke are fixed names in the same
          # shared dockerd. wgsmoke matters more than idempotent creation
          # suggests: the runner has two slots, so two runs can overlap,
          # and a shared /data means one run's unattended-setup seeds state
          # the other inherits — a pass could mean "the other run set this
          # up", not "this image works". The same risk exists across time
          # too: a leftover volume means the next run's setup isn't
          # touching a clean volume. Removed by exact name below at the end
          # of this step — never by prune, pattern or age.
          WG="wg-${{ github.run_id }}"
          VOL="wgsmoke-${{ github.run_id }}"
          echo "=== binary version check (blocking) ==="
          # `warpgate --version` (clap's auto flag) only ever prints
          # CARGO_PKG_VERSION (e.g. "0.28.6") — it can never match $TAG. The
          # binary's real build identity comes from the `version` subcommand
          # (warpgate/src/main.rs Commands::Version), which prints
          # `warpgate_version()` — warpgate-common/src/version.rs's
          # git_version!(args = ["--tags", "--always", "--dirty=-modified",
          # "--match", "v[0-9]*"]). Compute the expected string with the
          # identical git-describe invocation rather than reusing $TAG
          # (which is deliberately `--long` with no --match, for the image
          # tag's own interface contract) so this check is correct even when
          # the two formulas would otherwise diverge (e.g. HEAD sitting
          # exactly on a v* tag).
          EXPECTED_VERSION="warpgate $(git describe --tags --always --dirty=-modified --match 'v[0-9]*')"
          # NOT `docker run $IMG warpgate version` (2026-09-15, run 493/2439):
          # the image's ENTRYPOINT is already ["warpgate"] (Dockerfile.cove:221),
          # so passing "warpgate" as the first ARG runs `warpgate warpgate
          # version` and clap answers `error: unrecognized subcommand`, exit 2.
          # The `version` subcommand is present and correct — main.rs:148
          # Commands::Version, printing "warpgate {warpgate_version()}" at :171 —
          # so this was never a missing subcommand, only a duplicated binary
          # name. It exits 2 before anything later in the workflow, so the smoke
          # test and push steps after it have never run.
          #
          # Second defect in this step, found by the same run: under `set -e`
          # a bare `ACTUAL_VERSION=$(docker run ...)` ABORTS the step the
          # instant docker exits nonzero, so the three echo lines below and
          # the "VERSION MISMATCH" message are unreachable on any docker
          # failure — confirmed by their total absence from 2439's log. The
          # step could only ever report a mismatch it was able to compute.
          # Capturing the status keeps the diagnostics reachable, so a future
          # failure here says what happened instead of just exiting 2.
          set +e
          ACTUAL_VERSION=$(docker run --rm "$IMG" version 2>&1)
          VERSION_RC=$?
          set -e
          echo "built tag:        $TAG"
          echo "expected version: $EXPECTED_VERSION"
          echo "actual version:   $ACTUAL_VERSION"
          if [ "$VERSION_RC" -ne 0 ]; then
            echo "VERSION CHECK COULD NOT RUN — \`docker run \$IMG version\` exited $VERSION_RC."
            echo "That is not a version mismatch: the binary never reported a version at all."
            echo "Check the ENTRYPOINT against the arguments passed here before assuming the build is wrong."
            exit 1
          fi
          [ "$ACTUAL_VERSION" = "$EXPECTED_VERSION" ] || { echo "VERSION MISMATCH — the binary does not report the commit it was built from"; exit 1; }
          docker volume create "$VOL"
          docker run --rm -v "$VOL":/data -e WARPGATE_ADMIN_PASSWORD=smoke-only $IMG \
            unattended-setup --data-path /data --http-port 8888 --record-sessions
          docker run -d --name "$WG" -v "$VOL":/data $IMG run
          for i in $(seq 1 30); do
            code=$(docker run --rm --network container:"$WG" docker.io/curlimages/curl:8.22.0 \
              -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:8888/@warpgate/api/info || true)
            [ "$code" = "200" ] && break; sleep 2
          done
          docker logs "$WG" | tail -20 || true
          test "$code" = "200"
      - name: cleanup smoke test resources
        # The removal used to sit at the end of the smoke test step above, so
        # any earlier failure in that step (`set -e`) skipped it and left the
        # run-scoped volume behind — measured at 9.68 GB of never-pruned
        # per-run volumes on talos02's scratch. `always()` makes this step run
        # even when the smoke test failed. The container is removed first:
        # `docker volume rm` refuses a volume still attached to a container,
        # running or not.
        if: ${{ always() && !startsWith(github.ref_name, 'wip/') }}
        run: |
          WG="wg-${{ github.run_id }}"
          VOL="wgsmoke-${{ github.run_id }}"
          docker rm -f "$WG" 2>/dev/null || true
          docker volume rm "$VOL" 2>/dev/null || true
          echo "=== volumes after cleanup (this run's $VOL must be absent) ==="
          docker volume ls
      - name: push
        if: ${{ !startsWith(github.ref_name, 'wip/') }}
        run: docker push git.tenfourty.site/jeremy/warpgate:$TAG
