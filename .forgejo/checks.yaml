# The translation of upstream's CI. Upstream's .github/workflows/* are never run;
# this file says which of their checks we run and how. Diff this against upstream
# when the drift detector fires.
upstream_tag: v0.28.6
checks:
  - name: cargo-deny
    upstream: cargo-deny.yml
    command: cargo deny check
    compiles: false
    state: reporting
    tools: [cargo, cargo-deny]
  - name: lockfile
    upstream: lockfile.yml
    command: .forgejo/scripts/check-lockfile.sh
    compiles: false
    state: reporting
    tools: [jq, find]
  - name: fmt-toml
    upstream: fmt-toml.yml
    command: cargo fmt-toml --check
    compiles: false
    state: reporting
    tools: [cargo, taplo]
  - name: biome
    upstream: biome.yml
    command: cd warpgate-web && biome ci .
    compiles: false
    state: reporting
    tools: [biome]
  - name: helm-lint
    upstream: helm-publish.yaml
    # Mistranslated until 2026-09-19 as `helm lint --strict helm && helm
    # template helm`. Run 529 -- the first run in which this check ever
    # actually executed -- returned `stat helm/Chart.yaml: no such file or
    # directory`. That is not a verdict on our chart; it is this line pointing
    # at a directory that is not a chart. Upstream's helm-publish.yaml sets
    # CHART_PATH: helm/warpgate and CHART_NAME: warpgate, and runs
    # `helm lint ${CHART_PATH} --strict` then
    # `helm template ${CHART_NAME} ${CHART_PATH} --debug >/dev/null`; ours had
    # neither the real path nor the release name. Now matched, less `--debug`,
    # which changes only diagnostic verbosity and not the exit status while
    # printing the whole rendered manifest to stderr on every green run.
    command: helm lint helm/warpgate --strict && helm template warpgate helm/warpgate >/dev/null
    compiles: false
    state: reporting
    tools: [helm]
  - name: clippy
    upstream: clippy.yml
    command: just clippy
    compiles: true
    state: reporting
    tools: [just, cargo]
  - name: schema-compat
    upstream: check-schema-compatibility.yml
    command: just openapi-all
    compiles: unverified
    state: reporting
    tools: [just, cargo]
  - name: unit-tests
    upstream: test.yml
    command: cargo llvm-cov test --workspace
    compiles: true
    state: reporting
    tools: [cargo]
  - name: release-build
    upstream: build.yml
    command: cargo build --all-features --release
    compiles: true
    state: reporting
    tools: [cargo]
  - name: sbom
    upstream: build.yml
    command: cargo cyclonedx --all-features
    compiles: true
    state: reporting
    tools: [cargo]
  - name: reprotest
    upstream: reprotest.yml
    command: .forgejo/scripts/reprotest.sh
    compiles: true
    state: excepted
    # UNVERIFIED -- this check has never run here (excepted since it was
    # written), so unlike every other tools: value above, this one was never
    # measured against a real run's log. cargo is a guess based on the
    # "capped Rust checks" bucket, not a confirmed fact. Re-check this the
    # day reprotest stops being excepted, before trusting it.
    tools: [cargo]
    reason: >-
      Manual-only upstream (workflow_dispatch) and stays manual here; it re-runs a
      full release build several times under a variance matrix and is not routine
      load. Not a failure, a deliberate opt-out.
    review_by: 2026-12-18
