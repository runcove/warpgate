# The translation of upstream's CI. Upstream's .github/workflows/* are never run;
# this file says which of their checks we run and how. Diff this against upstream
# when the drift detector fires.
upstream_tag: v0.28.6
checks:
  - name: cargo-deny
    upstream: cargo-deny.yml
    command: cargo deny check
    compiles: false
    state: reporting
    # LEAVES (traced 2026-09-19): `cargo deny check` -> the cargo-deny subcommand binary.
    # Upstream pins cargo-deny@0.18.9. Leaf, nothing below it.
    tools: [cargo, cargo-deny]
  - name: lockfile
    upstream: lockfile.yml
    command: .forgejo/scripts/check-lockfile.sh
    compiles: false
    # PROMOTED 2026-09-19. The bar for blocking is that the FAILING case has
    # been demonstrated, never a PASS alone -- a check that has only ever
    # passed may be passing because it looks at nothing, which is exactly what
    # this one did on 2026-09-18 with jq absent.
    #   * It fails: a lockfile with an entry missing resolved/integrity exits 1
    #     and names the entry (tests/test-check-lockfile.sh, proven by
    #     mutation four ways on disposable copies).
    #   * It refuses rather than passing when it cannot look: no jq (97), no
    #     lockfiles (99), a lockfileVersion it cannot read (99), a file with no
    #     entries (99). A refusal is never downgraded by state, so promoting
    #     this does not change how those are reported.
    #   * Its PASS now states its own scope -- "examined 2 lockfile(s), 331
    #     package entries" -- so a green result can be read without going to
    #     the repository to find out what it covered.
    # Cheap and deterministic: jq and find only, no network, no compile.
    state: blocking
    # LEAVES (traced 2026-09-19): `.forgejo/scripts/check-lockfile.sh` -> `find` and `jq`. Ours, so
    # the leaves are verified by that script's own test suite rather than by
    # reading an upstream workflow.
    tools: [jq, find]
  - name: fmt-toml
    upstream: fmt-toml.yml
    command: cargo fmt-toml --check
    compiles: false
    state: reporting
    # LEAVES (traced 2026-09-19): `cargo fmt-toml --check` -> the
    # cargo-fmt-toml subcommand binary. NOT taplo, which is what this
    # line said until today and is a different TOML formatter --
    # installing it would never have made this check run. Upstream's
    # fmt-toml.yml installs cargo-fmt-toml@0.0.16 explicitly, and there
    # is no `fmt-toml` alias in .cargo/config.toml.
    tools: [cargo, cargo-fmt-toml]
  - name: biome
    upstream: biome.yml
    command: cd warpgate-web && biome ci .
    compiles: false
    state: reporting
    # LEAVES (traced 2026-09-19): `cd warpgate-web && biome ci .` -> the biome binary. Upstream uses
    # biomejs/setup-biome@v2 with no version in the file, so ours stays where
    # Task 7C(a) put it: a DIVERGENCE, not a pin copied from upstream.
    tools: [biome]
  - name: helm-lint
    upstream: helm-publish.yaml
    # Mistranslated until 2026-09-19 as `helm lint --strict helm && helm
    # template helm`. Run 529 -- the first run in which this check ever
    # actually executed -- returned `stat helm/Chart.yaml: no such file or
    # directory`. That is not a verdict on our chart; it is this line pointing
    # at a directory that is not a chart. Upstream's helm-publish.yaml sets
    # CHART_PATH: helm/warpgate and CHART_NAME: warpgate, and runs
    # `helm lint ${CHART_PATH} --strict` then
    # `helm template ${CHART_NAME} ${CHART_PATH} --debug >/dev/null`; ours had
    # neither the real path nor the release name. Now matched, less `--debug`,
    # which changes only diagnostic verbosity and not the exit status while
    # printing the whole rendered manifest to stderr on every green run.
    command: helm lint helm/warpgate --strict && helm template warpgate helm/warpgate >/dev/null
    compiles: false
    # PROMOTED 2026-09-19, and this check needed the bar more than any other:
    # its only previous FAIL (run 529) was OUR mistranslation, not a verdict on
    # the chart, and an exit code cannot tell those apart. So the failing case
    # was demonstrated deliberately, on `git archive` copies, against the
    # corrected command -- three ways, each failing distinctly:
    #   * `version:` removed from Chart.yaml  -> [ERROR] Chart.yaml: version is required
    #   * broken template syntax              -> [ERROR] templates/: parse error ... unclosed action
    #   * `required` on an absent value       -> Error: execution error ... deliberately missing
    # The third is why both clauses are here and why `helm template` is not
    # redundant: measured, `helm lint --strict` PASSES that chart ("1 chart(s)
    # linted, 0 chart(s) failed") and only `helm template` catches it.
    # Control: the real chart passes both, rc=0.
    # Cheap and deterministic: helm only, no cluster, no network.
    state: blocking
    # LEAVES (traced 2026-09-19): `helm lint … --strict && helm template …` -> the helm binary.
    # Both clauses are load-bearing: measured, --strict PASSES a chart whose
    # `required` value is absent and only `helm template` catches it.
    tools: [helm]
  - name: clippy
    upstream: clippy.yml
    command: just clippy
    compiles: true
    state: reporting
    # cargo-cranky added 2026-09-19: the justfile recipe is `cargo cranky
    # --workspace --all-features`, and upstream's clippy.yml installs
    # cargo-cranky@0.3.0 explicitly. Undeclared, the probe passes and the
    # failure lands a layer deeper on the 127 backstop -- honest, but one
    # missing tool discovered per CI run.
    # LEAVES (traced 2026-09-19): `just clippy` -> justfile recipe `cargo cranky --workspace
    # --all-features` -> the cargo-cranky binary. Upstream also runs
    # `rustup component add clippy` and `mkdir -p warpgate-web/dist` first;
    # neither is in our command yet (runcove-xais).
    tools: [just, cargo, cargo-cranky]
  - name: schema-compat
    upstream: check-schema-compatibility.yml
    command: just openapi-all
    # Measured, no longer a hedge: it compiles two crates (above).
    compiles: true
    state: reporting
    # 2026-09-19: npm, not cargo. `just openapi-all` is
    # `cd warpgate-web && npm run ...` four times over -- it invokes no
    # cargo at all, so `cargo` was declared here and never used while the
    # tool it actually needs was missing. See runcove-xais: this check is
    # also only HALF of upstream's, which compares schemas with oasdiff.
    # LEAVES (traced 2026-09-19, after I got this wrong once): `just
    # openapi-all` -> `cd warpgate-web && npm run openapi:schema:admin`
    # -> `cargo run -p warpgate-admin > src/admin/lib/openapi-schema.json`,
    # and the same for the gateway via warpgate-protocol-http. So it DOES
    # need cargo -- through npm, not directly. Reading only the justfile
    # recipe says otherwise, and a run cannot correct it: the probe
    # reports declared tools that are missing and can never report a tool
    # that was never declared.
    #
    # git is here for the coming baseline comparison, which extracts the
    # upstream tag with `git archive` INSIDE the sandbox. That works
    # because hardened-run.sh copies the working tree rather than an
    # archive, so .git is delivered -- a deliberate choice recorded in
    # that script, relied on here.
    tools: [just, npm, cargo, git]
  - name: unit-tests
    upstream: test.yml
    command: cargo llvm-cov test --workspace
    compiles: true
    state: reporting
    # cargo-llvm-cov added 2026-09-19 (upstream test.yml pins 0.6.15
    # deliberately: 0.6.16+ pulls ruzstd 0.8.x). openssh-client and expect
    # are NOT declared, though upstream installs them: measured, `tests/`
    # is a PYTHON harness (conftest.py, api_client.py) and is not a
    # workspace member, so `cargo llvm-cov test --workspace` cannot reach
    # the code that needs them. The integration suite is out of scope by
    # plan. Declaring them would make this check refuse for tools its
    # command never invokes -- a refusal that should not happen is as
    # misleading as a pass that should not.
    # LEAVES (traced 2026-09-19): `cargo llvm-cov test --workspace` -> the cargo-llvm-cov binary.
    # Upstream pins 0.6.15 deliberately (0.6.16+ pulls ruzstd 0.8.x) and runs
    # three npm prep steps first that ours omits (runcove-xais).
    tools: [cargo, cargo-llvm-cov]
  - name: release-build
    upstream: build.yml
    command: cargo build --all-features --release
    compiles: true
    state: reporting
    # LEAVES (traced 2026-09-19): `cargo build --all-features --release`. Leaf, nothing below it --
    # the one capped check whose declared list was right all along.
    tools: [cargo]
  - name: sbom
    upstream: build.yml
    command: cargo cyclonedx --all-features
    compiles: true
    state: reporting
    # cargo-cyclonedx added 2026-09-19: the command is `cargo cyclonedx`,
    # which is a separate binary, not a builtin subcommand.
    # LEAVES (traced 2026-09-19): `cargo cyclonedx --all-features` -> the cargo-cyclonedx binary,
    # which is a separate binary and not a builtin subcommand.
    tools: [cargo, cargo-cyclonedx]
  - name: reprotest
    upstream: reprotest.yml
    command: .forgejo/scripts/reprotest.sh
    compiles: true
    state: excepted
    # UNVERIFIED -- this check has never run here (excepted since it was
    # written), so unlike every other tools: value above, this one was never
    # measured against a real run's log. cargo is a guess based on the
    # "capped Rust checks" bucket, not a confirmed fact. Re-check this the
    # day reprotest stops being excepted, before trusting it.
    # LEAVES (traced 2026-09-19): NONE -- and that is the finding.
    # `.forgejo/scripts/reprotest.sh` DOES NOT EXIST in this repo. The
    # command names a path that has never been written, and nobody
    # noticed because `excepted` means it never runs. Un-except it and it
    # fails with "No such file or directory" -- an ORDINARY-range failure
    # that no exit code distinguishes from upstream's verdict on our
    # code, which is this arc's fourth kind of FAIL sitting pre-armed in
    # the check list.
    #
    # Note what did NOT catch it: validate-checks.py reports
    # "ok: 11 check(s) valid" because it validates the SHAPE of an entry
    # -- fields present, types right, tag known -- and never asks whether
    # a command exists. A validator that cannot tell a real command from
    # a dangling one is the same defect as a check that cannot tell a
    # pass from not having looked. Tracked as runcove-uw2t.
    tools: [cargo]
    reason: >-
      Manual-only upstream (workflow_dispatch) and stays manual here; it re-runs a
      full release build several times under a variance matrix and is not routine
      load. Not a failure, a deliberate opt-out.
    review_by: 2026-12-18
