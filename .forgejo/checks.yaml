# The translation of upstream's CI. Upstream's .github/workflows/* are never run;
# this file says which of their checks we run and how. Diff this against upstream
# when the drift detector fires.
upstream_tag: v0.28.6
checks:
  - name: cargo-deny
    upstream: cargo-deny.yml
    command: cargo deny check
    compiles: false
    state: reporting
    # LEAVES (traced 2026-09-19): `cargo deny check` -> the cargo-deny subcommand binary.
    # Upstream pins cargo-deny@0.18.9. Leaf, nothing below it.
    tools: [cargo, cargo-deny]
  - name: lockfile
    upstream: lockfile.yml
    command: .forgejo/scripts/check-lockfile.sh
    compiles: false
    # PROMOTED 2026-09-19. The bar for blocking is that the FAILING case has
    # been demonstrated, never a PASS alone -- a check that has only ever
    # passed may be passing because it looks at nothing, which is exactly what
    # this one did on 2026-09-18 with jq absent.
    #   * It fails: a lockfile with an entry missing resolved/integrity exits 1
    #     and names the entry (tests/test-check-lockfile.sh, proven by
    #     mutation four ways on disposable copies).
    #   * It refuses rather than passing when it cannot look: no jq (97), no
    #     lockfiles (99), a lockfileVersion it cannot read (99), a file with no
    #     entries (99). A refusal is never downgraded by state, so promoting
    #     this does not change how those are reported.
    #   * Its PASS now states its own scope -- "examined 2 lockfile(s), 331
    #     package entries" -- so a green result can be read without going to
    #     the repository to find out what it covered.
    # Cheap and deterministic: jq, find and sed only, no network, no compile.
    state: blocking
    # LEAVES (traced 2026-09-19): `.forgejo/scripts/check-lockfile.sh` -> `find`, `jq` and `sed`.
    # Ours, so the leaves are verified by that script's own test suite rather
    # than by reading an upstream workflow.
    #   * sed: check-lockfile.sh:101, `echo "$missing" | sed 's/^/  /'`, which
    #     indents the entries a failure names. Added 2026-09-19 (runcove-tbxh).
    #     It is NOT coreutils, so the convention that lets coreutils go
    #     undeclared does not cover it. Undeclared, a missing sed gives a bare
    #     127 in the ordinary range; declared, the gate refuses 97 and says so.
    #     No CI run could have found this: the probe reports the tools a check
    #     DECLARES and finds missing, so a tool that was never declared is
    #     invisible to it. derive-tools.py now derives this list mechanically
    #     and validate-checks.py refuses a list that has drifted from it.
    tools: [jq, find, sed]
  - name: fmt-toml
    upstream: fmt-toml.yml
    command: cargo fmt-toml --check
    compiles: false
    state: reporting
    # LEAVES (traced 2026-09-19): `cargo fmt-toml --check` -> the
    # cargo-fmt-toml subcommand binary. NOT taplo, which is what this
    # line said until today and is a different TOML formatter --
    # installing it would never have made this check run. Upstream's
    # fmt-toml.yml installs cargo-fmt-toml@0.0.16 explicitly, and there
    # is no `fmt-toml` alias in .cargo/config.toml.
    tools: [cargo, cargo-fmt-toml]
  - name: biome
    upstream: biome.yml
    command: cd warpgate-web && biome ci .
    compiles: false
    # PROMOTED to blocking 2026-09-19, on evidence rather than on confidence:
    # run 563 is the first run in which this check ever produced a real verdict
    # (PASS), and 564 repeated it. Before that it refused 97 for a missing
    # binary, so promoting it would have been promoting a check that could not
    # run -- which fails the job for a reason that says nothing about our code.
    # It is promoted now because the fork's own patches are clean under it:
    # 468e6cf0 applied biome's verdict on our two patched Svelte files, and
    # `git diff -w` across that commit shows no semantic change, so a future
    # red here is a real new finding and not a backlog we chose to ignore.
    state: blocking
    # LEAVES (traced 2026-09-19): `cd warpgate-web && biome ci .` -> the biome binary. Upstream uses
    # biomejs/setup-biome@v2 with no version in the file, so ours stays where
    # Task 7C(a) put it: a DIVERGENCE, not a pin copied from upstream.
    tools: [biome]
  - name: helm-lint
    upstream: helm-publish.yaml
    # Mistranslated until 2026-09-19 as `helm lint --strict helm && helm
    # template helm`. Run 529 -- the first run in which this check ever
    # actually executed -- returned `stat helm/Chart.yaml: no such file or
    # directory`. That is not a verdict on our chart; it is this line pointing
    # at a directory that is not a chart. Upstream's helm-publish.yaml sets
    # CHART_PATH: helm/warpgate and CHART_NAME: warpgate, and runs
    # `helm lint ${CHART_PATH} --strict` then
    # `helm template ${CHART_NAME} ${CHART_PATH} --debug >/dev/null`; ours had
    # neither the real path nor the release name. Now matched, less `--debug`,
    # which changes only diagnostic verbosity and not the exit status while
    # printing the whole rendered manifest to stderr on every green run.
    command: helm lint helm/warpgate --strict && helm template warpgate helm/warpgate >/dev/null
    compiles: false
    # PROMOTED 2026-09-19, and this check needed the bar more than any other:
    # its only previous FAIL (run 529) was OUR mistranslation, not a verdict on
    # the chart, and an exit code cannot tell those apart. So the failing case
    # was demonstrated deliberately, on `git archive` copies, against the
    # corrected command -- three ways, each failing distinctly:
    #   * `version:` removed from Chart.yaml  -> [ERROR] Chart.yaml: version is required
    #   * broken template syntax              -> [ERROR] templates/: parse error ... unclosed action
    #   * `required` on an absent value       -> Error: execution error ... deliberately missing
    # The third is why both clauses are here and why `helm template` is not
    # redundant: measured, `helm lint --strict` PASSES that chart ("1 chart(s)
    # linted, 0 chart(s) failed") and only `helm template` catches it.
    # Control: the real chart passes both, rc=0.
    # Cheap and deterministic: helm only, no cluster, no network.
    state: blocking
    # LEAVES (traced 2026-09-19): `helm lint … --strict && helm template …` -> the helm binary.
    # Both clauses are load-bearing: measured, --strict PASSES a chart whose
    # `required` value is absent and only `helm template` catches it.
    tools: [helm]
  - name: clippy
    upstream: clippy.yml
    command: mkdir -p warpgate-web/dist && just clippy
    # THE `mkdir` IS NOT PADDING. warpgate-web/src/lib.rs derives RustEmbed on
    # `#[folder = "../warpgate-web/dist"]`, and RustEmbed fails to COMPILE when
    # that folder does not exist. A fresh checkout has no dist/, so without
    # this the crate — and therefore the whole workspace — fails to build, in
    # the ORDINARY range, indistinguishable from our code being broken.
    # Upstream does the same thing and calls it "Stub web assets for
    # RustEmbed" (clippy.yml). Found 2026-09-19 by reading lib.rs rather than
    # by a run; a run would have produced exactly the fake verdict described.
    # The stub is empty, so what is built embeds no UI: these checks assert
    # that the workspace COMPILES, never that the artefact is shippable.
    compiles: true
    state: reporting
    # cargo-cranky added 2026-09-19: the justfile recipe is `cargo cranky
    # --workspace --all-features`, and upstream's clippy.yml installs
    # cargo-cranky@0.3.0 explicitly. Undeclared, the probe passes and the
    # failure lands a layer deeper on the 127 backstop -- honest, but one
    # missing tool discovered per CI run.
    # LEAVES (traced 2026-09-19): `just clippy` -> justfile recipe `cargo cranky --workspace
    # --all-features` -> the cargo-cranky binary. Upstream also runs
    # `rustup component add clippy` and `mkdir -p warpgate-web/dist` first.
    # The mkdir is now in the command above. The clippy component is the
    # IMAGE's job, not the command's: it is installed into the sandbox image
    # (.forgejo/images/ci-toolchain/Dockerfile) so every capped check gets it
    # once rather than each command re-adding it per run.
    tools: [just, cargo, cargo-cranky]
  - name: schema-compat
    upstream: check-schema-compatibility.yml
    command: .forgejo/scripts/check-schema-compat.sh
    # Measured, no longer a hedge: it compiles two crates (below).
    compiles: true
    state: reporting
    # 2026-09-19: this was HALF of upstream's check. The command was
    # `just openapi-all`, which GENERATES a schema and stops; upstream
    # generates one and then compares it with `oasdiff breaking`. Generation
    # succeeding was being read as "no breaking changes", so the check could
    # not fail for the reason it exists. Our script does the comparison.
    #
    # LEAVES (traced 2026-09-19):
    #   check-schema-compat.sh
    #     -> python3 (+ PyYAML) for checks_lib.upstream_tag, which reads the
    #        baseline out of this file and RAISES rather than defaulting
    #     -> git rev-parse, git archive (the tag's committed schemas)
    #     -> tar (extracts that archive)
    #     -> npm run openapi:schema:{admin,gateway}
    #          -> cargo run -p warpgate-admin
    #          -> cargo run -p warpgate-protocol-http
    #     -> oasdiff breaking
    #
    # The cargo line is the one I got wrong once, and it is worth leaving
    # here as a warning rather than quietly correcting: reading only the
    # justfile recipe says `just openapi-all` is npm and no cargo at all, and
    # I reported exactly that. It is `npm run` dispatching two `cargo run`s,
    # visible only in warpgate-web/package.json. A CI run cannot catch that
    # class of error either -- the probe reports declared tools that are
    # missing, and can never report a tool that was never declared.
    #
    # WHERE THE AGREEMENT CHECK ACTUALLY FIRES. The script cross-checks
    # `upstream_tag` against the tag encoded in a `cove-patches-vX.Y.Z`
    # branch name. Only release branches encode one, so on `wip/**` -- which
    # is where our CI runs today -- the cross-check is skipped, and the run
    # says so rather than looking like a cross-checked green. A green here on
    # a wip branch is therefore no evidence the two records agree; only a run
    # on a cove-patches branch tests that. The unit tests exercise both
    # cases, which is the only place the agreement path runs at all for now.
    #
    # `just` is gone from this list because the script calls the two npm
    # scripts directly rather than through the justfile recipe (which also
    # generates TypeScript clients via a Java tool, for artefacts this check
    # never opens). That and two other divergences from upstream are argued
    # in the script's own header, not hidden here.
    #
    # python3 and tar are declared because this is a capped check: it runs
    # inside the sandbox image, where nothing is present unless we put it
    # there. PyYAML is a python package rather than a PATH entry, so the
    # tools gate cannot see it -- the sandbox image owes it (runcove-npoc).
    #
    # The script also uses basename, dirname, mkdir, mktemp, pwd, readlink
    # and rm. None is declared, following what every other check here does:
    # coreutils is assumed present in any base image we would build on. That
    # is an assumption, written down so it is a decision rather than an
    # oversight -- and if it is ever wrong the failure is loud (127, which
    # run-check.sh converts to 97), not a false pass.
    tools: [git, tar, python3, npm, cargo, oasdiff]
  - name: unit-tests
    upstream: test.yml
    command: mkdir -p warpgate-web/dist && cargo llvm-cov test --workspace
    # THE `mkdir` IS NOT PADDING. warpgate-web/src/lib.rs derives RustEmbed on
    # `#[folder = "../warpgate-web/dist"]`, and RustEmbed fails to COMPILE when
    # that folder does not exist. A fresh checkout has no dist/, so without
    # this the crate — and therefore the whole workspace — fails to build, in
    # the ORDINARY range, indistinguishable from our code being broken.
    # Upstream does the same thing and calls it "Stub web assets for
    # RustEmbed" (clippy.yml). Found 2026-09-19 by reading lib.rs rather than
    # by a run; a run would have produced exactly the fake verdict described.
    # The stub is empty, so what is built embeds no UI: these checks assert
    # that the workspace COMPILES, never that the artefact is shippable.
    compiles: true
    state: reporting
    # cargo-llvm-cov added 2026-09-19 (upstream test.yml pins 0.6.15
    # deliberately: 0.6.16+ pulls ruzstd 0.8.x). openssh-client and expect
    # are NOT declared, though upstream installs them: measured, `tests/`
    # is a PYTHON harness (conftest.py, api_client.py) and is not a
    # workspace member, so `cargo llvm-cov test --workspace` cannot reach
    # the code that needs them. The integration suite is out of scope by
    # plan. Declaring them would make this check refuse for tools its
    # command never invokes -- a refusal that should not happen is as
    # misleading as a pass that should not.
    # LEAVES (traced 2026-09-19): `cargo llvm-cov test --workspace` -> the cargo-llvm-cov binary.
    # Upstream pins 0.6.15 deliberately (0.6.16+ pulls ruzstd 0.8.x) and runs
    # three npm prep steps first that ours omits (runcove-xais).
    tools: [cargo, cargo-llvm-cov]
  - name: release-build
    upstream: build.yml
    command: mkdir -p warpgate-web/dist && SOURCE_DATE_EPOCH=0 cargo build --all-features --release
    # SOURCE_DATE_EPOCH=0 is upstream's, and their build.yml says why in one
    # word: "for rust-embed determinism". It is the one piece of upstream's
    # build environment genuinely missing from ours.
    #
    # The RUSTFLAGS half of upstream's env is deliberately NOT copied, and the
    # reason is measured rather than argued (nightly-2026-07-09, throwaway
    # crate, reading the rustc invocation out of `cargo build -v`):
    #
    #   * `.cargo/config.toml` already sets `--cfg tokio_unstable`,
    #     `-Zthreads=8` and `-Zremap-cwd-prefix=/reproducible-cwd` for
    #     `cfg(all())`, so they are in force on every cargo command here.
    #   * Setting plain `RUSTFLAGS` REPLACES those rather than adding to them.
    #     "Adding" upstream's flags that way would silently REMOVE
    #     `-Zthreads=8` and `-Zremap-cwd-prefix` — less reproducible, while
    #     looking like the opposite. Only the `CARGO_TARGET_<triple>_RUSTFLAGS`
    #     form combines, which is why upstream uses it.
    #
    # The remap flags are owed and are coming as a script (runcove-xais), not
    # as a one-liner: the env var name embeds the host triple, so on any other
    # architecture the flags are silently ignored — an absence, which is this
    # arc's whole failure mode. The script will derive the triple and assert
    # from `cargo build -v` that the flags reached rustc, refusing if not.
    # THE `mkdir` IS NOT PADDING. warpgate-web/src/lib.rs derives RustEmbed on
    # `#[folder = "../warpgate-web/dist"]`, and RustEmbed fails to COMPILE when
    # that folder does not exist. A fresh checkout has no dist/, so without
    # this the crate — and therefore the whole workspace — fails to build, in
    # the ORDINARY range, indistinguishable from our code being broken.
    # Upstream does the same thing and calls it "Stub web assets for
    # RustEmbed" (clippy.yml). Found 2026-09-19 by reading lib.rs rather than
    # by a run; a run would have produced exactly the fake verdict described.
    # The stub is empty, so what is built embeds no UI: these checks assert
    # that the workspace COMPILES, never that the artefact is shippable.
    compiles: true
    state: reporting
    # LEAVES (traced 2026-09-19): `cargo build --all-features --release`. Leaf, nothing below it --
    # the one capped check whose declared list was right all along.
    tools: [cargo]
  - name: sbom
    upstream: build.yml
    command: cargo cyclonedx --all-features
    compiles: true
    state: reporting
    # cargo-cyclonedx added 2026-09-19: the command is `cargo cyclonedx`,
    # which is a separate binary, not a builtin subcommand.
    # DIVERGENCE, deliberate and deferred: RUST BOM ONLY; THE NPM BOM IS NOT
    # MERGED. Upstream's build.yml builds the product's SBOM by merging this
    # Rust BOM with the admin-UI npm BOM (cyclonedx-npm@4.1.2 plus the
    # CycloneDX CLI v0.27.2, after a full `just npm ci` and `npm run build`).
    # An SBOM missing every npm dependency is not an SBOM of this product —
    # the same shape schema-compat had before it learned to compare. Deferred
    # on 2026-09-19 because nothing consumes the fork's SBOM yet and the merge
    # drags a full npm install and two more tools into the sandbox image.
    # Tracked as runcove-f1b9, to be taken only after the Rust path has
    # produced a real verdict on the image. This note is the interim answer
    # and is not a substitute for that bead.
    # LEAVES (traced 2026-09-19): `cargo cyclonedx --all-features` -> the cargo-cyclonedx binary,
    # which is a separate binary and not a builtin subcommand.
    tools: [cargo, cargo-cyclonedx]
  - name: reprotest
    upstream: reprotest.yml
    command: .forgejo/scripts/reprotest.sh
    compiles: true
    state: excepted
    # UNVERIFIED -- this check has never run here (excepted since it was
    # written), so unlike every other tools: value above, this one was never
    # measured against a real run's log. cargo is a guess based on the
    # "capped Rust checks" bucket, not a confirmed fact. Re-check this the
    # day reprotest stops being excepted, before trusting it.
    # LEAVES (traced 2026-09-19): NONE -- and that is the finding.
    # `.forgejo/scripts/reprotest.sh` DOES NOT EXIST in this repo. The
    # command names a path that has never been written, and nobody
    # noticed because `excepted` means it never runs. Un-except it and it
    # fails with "No such file or directory" -- an ORDINARY-range failure
    # that no exit code distinguishes from upstream's verdict on our
    # code, which is this arc's fourth kind of FAIL sitting pre-armed in
    # the check list.
    #
    # Note what did NOT catch it: validate-checks.py reports
    # "ok: 11 check(s) valid" because it validates the SHAPE of an entry
    # -- fields present, types right, tag known -- and never asks whether
    # a command exists. A validator that cannot tell a real command from
    # a dangling one is the same defect as a check that cannot tell a
    # pass from not having looked. Tracked as runcove-uw2t.
    tools: [cargo]
    reason: >-
      Manual-only upstream (workflow_dispatch) and stays manual here; it re-runs a
      full release build several times under a variance matrix and is not routine
      load. Not a failure, a deliberate opt-out.
    review_by: 2026-12-18
