# Synthetic checks.yaml for testing run-check.sh's declared `tools:`
# precondition (Task 7A) in isolation from the real checks.yaml -- whose
# tools (cargo, jq, helm, ...) really are installed on a dev host, which
# would make a PATH-restriction test pass by accident rather than by the
# logic under test. "cargo" here is a stand-in for any real tool a check
# might declare; it is never actually invoked by these fixture commands.
upstream_tag: v0.28.6
checks:
  - name: fake-missing-tool
    upstream: build.yml
    command: "echo SHOULD_NOT_RUN_MARKER"
    compiles: false
    state: reporting
    tools: [cargo]
  - name: fake-missing-multi
    upstream: build.yml
    command: "echo SHOULD_NOT_RUN_MULTI"
    compiles: false
    state: reporting
    tools: [cargo, made-up-tool-zzz]
  - name: fake-present-tool
    upstream: build.yml
    command: "true"
    compiles: false
    state: reporting
    tools: [bash]
  # Capped entries, added 2026-09-19 for the split tools gate. A capped check's
  # command runs inside hardened-run.sh's container, so its tools must be
  # checked THERE, not in the job container. "made-up-tool-zzz" is absent from
  # every PATH by construction, so the missing-tool case needs no PATH
  # restriction -- which matters here because a crippled PATH makes the shell
  # itself fail for reasons unrelated to the thing under test (2026-09-19).
  #
  # This said "the probe is executed through `bash -lc`" until later the same
  # day. It is `bash -c` now: a login shell re-reads PATH from /etc/profile,
  # which ASSIGNS rather than extends it, and that is what made run 567 refuse
  # 97 for five tools the image demonstrably contained. Note what this comment
  # did -- it observed the login shell being fragile about PATH and routed
  # around the symptom instead of asking what it did to PATH.
  - name: fake-capped-missing-tool
    upstream: build.yml
    command: "echo SHOULD_NOT_RUN_CAPPED"
    compiles: true
    state: reporting
    tools: [made-up-tool-zzz]
  - name: fake-capped-present-tool
    upstream: build.yml
    command: "echo CAPPED_COMMAND_RAN"
    compiles: true
    state: reporting
    tools: [bash]
  # TWO absent tools, so "names both" is distinguishable from "names the
  # first". A fixture with one missing tool cannot tell those apart, which is
  # exactly how the short-circuit survived until a real run exposed it. Both
  # names are absent from every PATH by construction, and `bash` is declared
  # FIRST and is present -- so a probe that stopped at the first MISS still
  # has to walk past a hit to reach them, and a probe that stopped at the
  # first entry of any kind would name nothing and fail loudly.
  - name: fake-capped-missing-multi
    upstream: build.yml
    command: "echo SHOULD_NOT_RUN_CAPPED_MULTI"
    compiles: true
    state: reporting
    tools: [bash, made-up-tool-zzz, made-up-tool-yyy]
