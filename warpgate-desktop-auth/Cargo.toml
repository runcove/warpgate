[package]
name = "warpgate-desktop-auth"
version = "0.23.4"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tracing.workspace = true
uuid.workspace = true
warpgate-common = { path = "../warpgate-common", default-features = false }
warpgate-common-http = { path = "../warpgate-common-http", default-features = false }
warpgate-core = { path = "../warpgate-core", default-features = false }
warpgate-desktop-ui = { path = "../warpgate-desktop-ui" }

[dev-dependencies]
sea-orm.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros"] }
warpgate-db-entities = { path = "../warpgate-db-entities", default-features = false }
warpgate-db-migrations = { path = "../warpgate-db-migrations", features = ["sqlite"] }
